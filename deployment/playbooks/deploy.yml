---
- name: Publish a demo application to an ACP workload cluster
  hosts: localhost
  gather_facts: false

  vars:
    deploy_package_env: "{{ lookup('env', 'DEPLOY_PACKAGE') | default('', true) }}"
    deploy_config_env: "{{ lookup('env', 'DEPLOY_CONFIG') | default('', true) }}"
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('/run/secrets/workload-kubeconfig', true) }}"
    global_kubeconfig: "{{ lookup('env', 'ACP_GLOBAL_KUBECONFIG') | default('/run/secrets/global-kubeconfig', true) }}"
    kube_context: "{{ lookup('env', 'ACP_KUBE_CONTEXT') | default('proxy-connect', true) }}"
    global_kube_context: "{{ lookup('env', 'ACP_GLOBAL_KUBE_CONTEXT') | default('proxy-connect', true) }}"
    workload_cluster_env: "{{ lookup('env', 'ACP_WORKLOAD_CLUSTER') | default('', true) }}"
    validate_certs: "{{ lookup('env', 'ACP_VALIDATE_CERTS') | default('true', true) | bool }}"
    mounted_package: /work/project/deployment
    baked_package: /opt/deploy-package

  tasks:
    - name: Resolve the deployment package directory
      ansible.builtin.set_fact:
        deploy_package: "{{ resolved_package }}"
      vars:
        resolved_package: >-
          {{
            deploy_package_env
            if deploy_package_env | length > 0
            else (
              mounted_package
              if (mounted_package ~ '/playbooks/deploy.yml') is file
              else baked_package
            )
          }}

    - name: Resolve the deployment config file
      ansible.builtin.set_fact:
        deploy_config: "{{ resolved_config }}"
      vars:
        customer_config: "{{ deploy_package ~ '/config/customer.yaml' }}"
        example_config: "{{ deploy_package ~ '/config/customer.example.yaml' }}"
        resolved_config: >-
          {{
            deploy_config_env
            if deploy_config_env | length > 0
            else (
              customer_config
              if customer_config is file
              else example_config
            )
          }}

    - name: Load deployment parameters
      ansible.builtin.include_vars:
        file: "{{ deploy_config }}"
        name: app

    - name: Resolve the workload cluster name
      ansible.builtin.set_fact:
        workload_cluster_name: "{{ resolved_cluster }}"
      vars:
        resolved_cluster: >-
          {{
            workload_cluster_env
            if workload_cluster_env | length > 0
            else (app.workload_cluster_name | default('', true))
          }}

    - name: Validate deployment parameters
      ansible.builtin.assert:
        that:
          - app.project_name == 'ansible'
          - app.namespace == 'ansible-demo'
          - app.namespace is string
          - app.namespace | length > 0
          - workload_cluster_name is string
          - workload_cluster_name | length > 0
          - app.application_name is string
          - app.application_name | length > 0
          - app.image is string
          - app.image | length > 0
          - app.replicas | int > 0
          - app.container_port | int > 0
          - app.service_port | int > 0
        fail_msg: "Deployment config is incomplete or invalid. Set workload_cluster_name in the config or ACP_WORKLOAD_CLUSTER."

    - name: Confirm target Project on the Global cluster
      kubernetes.core.k8s_info:
        api_version: auth.alauda.io/v1
        kind: Project
        name: "{{ app.project_name }}"
        kubeconfig: "{{ global_kubeconfig }}"
        context: "{{ global_kube_context }}"
        validate_certs: "{{ validate_certs }}"
      register: project_info

    - name: Create the validation Project on Global when absent
      kubernetes.core.k8s:
        api_version: auth.alauda.io/v1
        kind: Project
        name: "{{ app.project_name }}"
        kubeconfig: "{{ global_kubeconfig }}"
        context: "{{ global_kube_context }}"
        validate_certs: "{{ validate_certs }}"
        state: present
        definition:
          metadata:
            name: "{{ app.project_name }}"
            labels:
              cpaas.io/project: "{{ app.project_name }}"
              cpaas.io/project.level: "1"
              cpaas.io/project.parent: ""
            annotations:
              cpaas.io/display-name: Ansible
              cpaas.io/description: Ansible deployment validation project
          spec:
            clusters:
              - name: "{{ workload_cluster_name }}"
                quota: {}
                type: ""
      when: project_info.resources | length == 0

    - name: Wait for ACP to reconcile the validation Project
      kubernetes.core.k8s_info:
        api_version: auth.alauda.io/v1
        kind: Project
        name: "{{ app.project_name }}"
        kubeconfig: "{{ global_kubeconfig }}"
        context: "{{ global_kube_context }}"
        validate_certs: "{{ validate_certs }}"
      register: project_reconcile
      until:
        - project_reconcile.resources | length == 1
        - project_reconcile.resources[0].status.phase | default('') == 'Active'
        - project_reconcile.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'ProjectNameSpace') | selectattr('status', 'equalto', 'True') | list | length == 1
      retries: 30
      delay: 5

    - name: Confirm the reconciled Project is associated with the workload cluster
      ansible.builtin.assert:
        that:
          - project_reconcile.resources | length == 1
          - workload_cluster_name in (project_reconcile.resources[0].spec.clusters | map(attribute='name') | list)
        fail_msg: >-
          Project {{ app.project_name }} must be associated with workload cluster {{ workload_cluster_name }}.

    - name: Confirm target Namespace exists on the workload cluster
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ app.namespace }}"
        kubeconfig: "{{ kubeconfig }}"
        context: "{{ kube_context }}"
        validate_certs: "{{ validate_certs }}"
      register: namespace_info

    - name: Create the validation Namespace when absent
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ app.namespace }}"
        kubeconfig: "{{ kubeconfig }}"
        context: "{{ kube_context }}"
        validate_certs: "{{ validate_certs }}"
        state: present
        definition:
          metadata:
            name: "{{ app.namespace }}"
            labels:
              cpaas.io/cluster: "{{ workload_cluster_name }}"
              cpaas.io/project: "{{ app.project_name }}"
              cpaas.io/project-inner-namespace: "{{ app.project_name }}"
      when: namespace_info.resources | length == 0

    - name: Re-read the validation Namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ app.namespace }}"
        kubeconfig: "{{ kubeconfig }}"
        context: "{{ kube_context }}"
        validate_certs: "{{ validate_certs }}"
      register: namespace_info_after

    - name: Render application Deployment manifest
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/deployment.yml.j2"
        dest: /tmp/ansible-demo-deployment.yml
        mode: "0644"

    - name: Apply application Deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        context: "{{ kube_context }}"
        validate_certs: "{{ validate_certs }}"
        state: present
        src: /tmp/ansible-demo-deployment.yml

    - name: Render application Service manifest
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/service.yml.j2"
        dest: /tmp/ansible-demo-service.yml
        mode: "0644"

    - name: Apply application Service
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        context: "{{ kube_context }}"
        validate_certs: "{{ validate_certs }}"
        state: present
        src: /tmp/ansible-demo-service.yml

    - name: Wait for the application Deployment to become ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ app.application_name }}"
        namespace: "{{ app.namespace }}"
        kubeconfig: "{{ kubeconfig }}"
        context: "{{ kube_context }}"
        validate_certs: "{{ validate_certs }}"
      register: deployment_info
      until:
        - deployment_info.resources | length == 1
        - (deployment_info.resources[0].status.readyReplicas | default(0) | int) >= (app.replicas | int)
        - (deployment_info.resources[0].status.updatedReplicas | default(0) | int) >= (app.replicas | int)
      retries: 30
      delay: 5

    - name: Report the completed application release
      ansible.builtin.debug:
        msg:
          application: "{{ app.application_name }}"
          namespace: "{{ app.namespace }}"
          image: "{{ app.image }}"
          workload_cluster: "{{ workload_cluster_name }}"
          ready_replicas: "{{ deployment_info.resources[0].status.readyReplicas | default(0) | int }}"
          cluster_context: "{{ kube_context }}"
